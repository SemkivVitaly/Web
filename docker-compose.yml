# LocalChat: API + веб + OnlyOffice + Точка сбора (uchet).
#
# Запуск:  docker compose up --build -d
# Чат:     http://localhost:3780
# Учёт:    http://localhost:3000  (вкладка «Точка сбора» в группе)
# OnlyOffice: порт на хосте ONLYOFFICE_PORT (по умолчанию 8081)
#
# LAN: в .env укажите LAN_HOST=<IP этого ПК>

services:
  localchat:
    build: .
    container_name: localchat
    ports:
      - '3780:3780'
    depends_on:
      - onlyoffice
    environment:
      NODE_ENV: production
      PORT: '3780'
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-docker-dev-change-jwt-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3780,http://127.0.0.1:3780,http://localchat:3780,http://${LAN_HOST:-localhost}:3780,http://localhost:3000,http://127.0.0.1:3000,http://${LAN_HOST:-localhost}:3000}
      ONLYOFFICE_DOCUMENT_SERVER_URL: ${ONLYOFFICE_DOCUMENT_SERVER_URL:-http://${LAN_HOST:-localhost}:${ONLYOFFICE_PORT:-8081}}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localchat:3780}
    volumes:
      - ./server/data:/app/server/data
      - ./server/uploads:/app/server/uploads

  uchet:
    build:
      context: ./uchet
      dockerfile: Dockerfile
    container_name: localchat-uchet
    ports:
      - '${UCHET_PORT:-3000}:3000'
    depends_on:
      - localchat
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      DATABASE_URL: file:/app/data/custom.db
      UCHET_DATA_DIR: /app/data
      UCHET_DB_TEMPLATE: /app/db-template/custom.db
      AUTH_SECRET: ${UCHET_AUTH_SECRET:-docker-dev-change-uchet-auth-secret}
      CHAT_URL: http://localchat:3780
      CHAT_PUBLIC_URL: ${CHAT_PUBLIC_URL:-http://${LAN_HOST:-localhost}:3780}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-http://localhost:3780,http://127.0.0.1:3780,http://${LAN_HOST:-localhost}:3780}
      APP_URL: ${UCHET_APP_URL:-http://localhost:3000}
    volumes:
      - ./uchet/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: localchat-onlyoffice
    ports:
      - '${ONLYOFFICE_PORT:-8081}:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      JWT_ENABLED: 'false'
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
    volumes:
      - ./deploy/onlyoffice/local-production-linux.json:/etc/onlyoffice/documentserver/local-production-linux.json:ro
